<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arm demo dev harness</title>
<!-- Dev harness only. The real embed lives in the RBE-3001 project page (ui-b). -->
<style>
:root { --paper:#faf8f4; --ink:#16171a; --ink-2:#3d4047; --ink-3:#5f646c; --rule:#dedad2; --frame:#eeebe4; --accent:#1f5fae; --mark:#0f8b8d; --measure:62ch; }
@media (prefers-color-scheme: dark) { :root { --paper:#121314; --ink:#eeece7; --ink-2:#c9c8c3; --ink-3:#a3a7ae; --rule:#2d2f33; --frame:#1d1f21; --accent:#8db8f2; } }
body { margin:0; background:var(--paper); color:var(--ink); font:17px/1.6 system-ui, sans-serif; }
main { max-width:1180px; margin:24px auto; padding:0 20px; }
figcaption { font-size:15px; color:var(--ink-2); padding-top:8px; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<main>
<figure class="fig"><div data-arm3d></div><figcaption>Live: the camera finds each ball, converts its position to the arm's frame, and the arm sorts it.</figcaption></figure>
</main>
<script type="module" src="arm-demo.js"></script>
</body>
</html>
