<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UR5e dynamics demo dev harness</title>
<!-- Dev harness only. Tokens copied from portfolio-ui-b/assets/css/site.css. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --paper:#faf8f4; --ink:#16171a; --ink-2:#3d4047; --ink-3:#5f646c; --rule:#dedad2; --frame:#eeebe4; --mark:#0f8b8d; --measure:62ch;
  --sans:"Geist", -apple-system, "Segoe UI", Roboto, sans-serif; }
@media (prefers-color-scheme: dark) { :root { --paper:#121314; --ink:#eeece7; --ink-2:#c9c8c3; --ink-3:#a3a7ae; --rule:#2d2f33; --frame:#1d1f21; --mark:#3cc3c4; } }
body { margin:0; background:var(--paper); color:var(--ink); font:18px/1.55 var(--sans); }
main { max-width:1040px; margin:24px auto; padding:0 20px; }
figure { margin:0; }
figcaption { font-size:15px; color:var(--ink-2); padding-top:8px; max-width:var(--measure); }
</style>
<link rel="stylesheet" href="ur5e.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<main>
<figure>
<div data-ur5e3d></div>
<figcaption>UR5e, simulated live from its published masses and inertias. Teal arrows S<sub>1</sub> to S<sub>6</sub> are the joint screw axes in the current pose; the grey ellipsoid at the tool is its velocity manipulability ellipsoid. Torques come from recursive Newton-Euler, and the arm moves by integrating its forward dynamics at 1 kHz under the selected controller.</figcaption>
</figure>
</main>
<script type="module" src="ur5e-demo.js"></script>
</body>
</html>
